name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Syntax, Templates, and Linter Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install chezmoi and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          CHEZMOI_VERSION="$(awk -F'"' '/^chezmoi[[:space:]]*=/ { print $2; exit }' .chezmoidata.toml)"
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$HOME/.local/bin" -t "v${CHEZMOI_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Betterleaks secret scan
        run: |
          BETTERLEAKS_VERSION="$(awk -F'"' '/^betterleaks[[:space:]]*=/ { print $2; exit }' .chezmoidata.toml)"
          curl -sSfL "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$HOME/.local/bin" betterleaks || true
          if command -v betterleaks >/dev/null 2>&1; then
            betterleaks dir --no-banner --redact .
          fi

      - name: Run Linux CI checks (fast, network-isolated)
        run: CI_SKIP_NETWORK=1 bash ./scripts/ci-check.sh

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            'bootstrap.ps1'
            'setup-ssh.ps1'
            'dot_config/powershell/agent-env.ps1'
            'dot_config/powershell/profile.ps1'
            'dot_local/share/mydotfiles/configure-terminal-fonts.ps1'
          )
          foreach ($file in $files) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$null,
              [ref]$errors
            )
            if ($errors) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
            Write-Host "PowerShell syntax OK: $file"
          }

          $templateFiles = @(
            '.chezmoiscripts/run_once_before_migrate-ssh-config.ps1.tmpl'
            '.chezmoiscripts/run_onchange_after_configure-terminal-bell.ps1.tmpl'
            '.chezmoiscripts/run_onchange_after_install-packages.ps1.tmpl'
          )
          foreach ($file in $templateFiles) {
            $templateLines = Get-Content -LiteralPath $file
            $scriptBody = $templateLines[1..($templateLines.Count - 2)] -join "`n"
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseInput(
              $scriptBody,
              [ref]$null,
              [ref]$errors
            )
            if ($errors) {
              $errors | ForEach-Object { Write-Error "$file`: $_" }
              exit 1
            }
            Write-Host "PowerShell template syntax OK: $file"
          }

      - name: Analyze PowerShell scripts with PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          $files = @(
            'bootstrap.ps1'
            'setup-ssh.ps1'
            'dot_config/powershell/agent-env.ps1'
            'dot_config/powershell/profile.ps1'
            'dot_local/share/mydotfiles/configure-terminal-fonts.ps1'
          )
          foreach ($file in $files) {
            $results = Invoke-ScriptAnalyzer -Path $file -Severity Error
            if ($results) {
              $results | Format-Table -AutoSize
              exit 1
            }
          }

  matrix-container-test:
    name: Container Install (profile=server)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12']
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install bootstrap prerequisites
        run: |
          apt-get update && apt-get install -y curl git bash

      - name: Test chezmoi apply (server profile)
        run: |
          CHEZMOI_VERSION="$(awk -F'"' '/^chezmoi[[:space:]]*=/ { print $2; exit }' .chezmoidata.toml)"
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b /usr/local/bin -t "v${CHEZMOI_VERSION}"
          chezmoi init --source . --apply --dry-run --promptChoice profile=server
