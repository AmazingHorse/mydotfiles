# Keys chezmoi owns in ~/.omp/agent/config.yml. Deep-merged over the live file by
# dot_omp/private_agent/modify_config.yml; every other key (models, theme, ...) is left to omp.
#
# Approval model (omp 18.x):
#   approvalMode "write" auto-approves read-tier tools (read, grep, glob, lsp queries)
#   and write-tier tools (edit, write, lsp rename). tools.approval.bash "allow"
#   disables omp's native bash approval so the command-guard extension's
#   prefix rules (session > project-local > project > user > defaults) decide;
#   omp's built-in critical-command patterns still prompt as a backstop.
lsp:
  enabled: true
debug:
  enabled: true
tools:
  approvalMode: write
  approval:
    agy_query: allow
    bash: allow
session:
  worktreeScope: repo
# Native session worktree lifecycle (omp manages real linked git worktrees on
# wt/<timestamp> branches; wt list/merge/remove still operate on them):
#   onStart=create  fresh interactive sessions start in a new linked worktree
#   onExit=ask      on exit (incl. Ctrl+C shutdown) prompt keep vs remove;
#                   pristine worktrees offer instant removal, dirty/commit
#                   worktrees default to keep
# Opt out per invocation: OMP_NO_WT=1 omp  (-> --config ~/.omp/agent/no-worktree.yml)
worktree:
  onStart: create
  onExit: ask
