# Keys chezmoi owns in ~/.omp/agent/config.yml. Deep-merged over the live file by
# dot_omp/private_agent/modify_config.yml; every other key (models, theme, ...) is left to omp.
#
# Approval model (omp 18.x):
#   approvalMode "write" auto-approves read-tier tools (read, grep, glob, lsp queries)
#   and write-tier tools (edit, write, lsp rename). tools.approval.bash "allow"
#   disables omp's native bash approval so the command-guard extension's
#   prefix rules (session > project-local > project > user > defaults) decide;
#   omp's built-in critical-command patterns still prompt as a backstop.
lsp:
  enabled: true
debug:
  enabled: true
tools:
  approvalMode: write
  approval:
    agy_query: allow
    bash: allow
